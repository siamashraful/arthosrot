<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="Arthosrot">
<!-- Arthosrot · অর্থস্রোত — mark-compact (optical size: use at 24px and below)
     The float: a plain-weave field whose leading edge is still being laid.
     Alternate wefts pass under the warp (notched) and over it (unbroken) —
     real plain weave — and the right edge steps back row by row: the row in
     progress. Filled, partially filled, resting, in one figure.
     Outlined vector; no font needed at render time. Colour = currentColor. -->

# Render Blueprint — event/reconciliation worker (free instance).
#
# Free-tier reality (docs/architecture/DEPLOYMENT.md): the instance sleeps after
# 15 minutes without inbound traffic and wakes in ~30-60s. The GitHub Actions
# reconcile schedule (market hours) performs genuine reconciliation and wakes it;
# missed stream events are recovered exactly-once via the replayable SSE cursor.
services:
  - type: web
    name: arthosrot-worker
    runtime: node
    plan: free
    # Deploys come from CI (.github/workflows/ci.yml `deploy-worker`), after
    # every gate passes — never straight from a push.
    autoDeploy: false
    buildCommand: pnpm install --frozen-lockfile
    startCommand: pnpm start:worker
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: BROKER_PROVIDER
        value: alpaca-paper
      - key: MARKET_DATA_PROVIDER
        value: alpaca
      - key: DATABASE_URL
        sync: false
      - key: ALPACA_BROKER_KEY
        sync: false
      - key: ALPACA_BROKER_SECRET
        sync: false
      - key: ALPACA_DATA_KEY
        sync: false
      - key: ALPACA_DATA_SECRET
        sync: false
      - key: CRON_SECRET
        sync: false
      # Top 100 ranking job (src/worker/jobs): SEC fair-access UA with a
      # contact email; unset disables the job. Interval defaults to 24h.
      - key: SEC_USER_AGENT
        sync: false
      - key: TOP100_REFRESH_INTERVAL
        value: 24h
      # Price alerts: checked whenever the worker runs due jobs — on every
      # market-hours /reconcile call (every 10 min) and the hourly tick. 9m
      # keeps the job due on each 10-minute reconcile. Users with the app open
      # are also evaluated on every alerts read (the bell's 60s poll).
      - key: ALERTS_CHECK_INTERVAL
        value: 9m

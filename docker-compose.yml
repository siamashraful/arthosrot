# Local Postgres for development and integration tests.
# Usage: pnpm db:up   (= docker compose up -d), then pnpm db:migrate && pnpm db:seed
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: arthosrot
      POSTGRES_PASSWORD: arthosrot
      POSTGRES_DB: arthosrot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arthosrot"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:

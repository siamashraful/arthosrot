# Local Postgres for development and integration tests.
# Usage: docker compose up -d   (or `pnpm db:up` once db scripts land in Phase 2)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ledgerline
      POSTGRES_PASSWORD: ledgerline
      POSTGRES_DB: ledgerline
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerline"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format

      - name: Lint (includes module-boundary rules)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Token contrast check (WCAG)
        run: pnpm check:contrast

      - name: Build
        run: pnpm build

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: arthosrot
          POSTGRES_PASSWORD: arthosrot
          POSTGRES_DB: arthosrot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U arthosrot"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://arthosrot:arthosrot@localhost:5432/arthosrot_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply migrations from zero (validation)
        run: DATABASE_URL=$TEST_DATABASE_URL pnpm db:migrate
      - name: Integration tests
        run: pnpm test:int

  e2e:
    # Full-browser golden paths (desktop + mobile) against the deterministic
    # broker — offline by construction. PRs to main + main pushes.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: arthosrot
          POSTGRES_PASSWORD: arthosrot
          POSTGRES_DB: arthosrot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U arthosrot"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://arthosrot:arthosrot@localhost:5432/arthosrot
      BETTER_AUTH_SECRET: ci-e2e-secret-000000000000
      BROKER_PROVIDER: deterministic
      MARKET_DATA_PROVIDER: fixture
      FORCE_MARKET_OPEN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Apply migrations + seed
        run: pnpm db:migrate && pnpm db:seed
      - name: E2E (desktop + mobile, incl. axe scans)
        run: pnpm test:e2e

  deploy-worker:
    # The worker's release step (docs/architecture/DEPLOYMENT.md): Render has no
    # GitHub connection to this repo, so it never hears about pushes — CI
    # deploys it instead, and only a commit that passed every gate above ships.
    # Pinned to github.sha so a later push can't slip untested code into this
    # deploy; serialized so two pushes never race on the one service.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, integration, e2e]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-worker
      cancel-in-progress: false
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      SERVICE_ID: srv-da7qi13bc2fs73bs3iq0 # arthosrot-worker
    steps:
      - name: Deploy ${{ github.sha }} to Render and wait until live
        run: |
          set -euo pipefail
          api=https://api.render.com/v1/services/$SERVICE_ID/deploys
          auth="Authorization: Bearer $RENDER_API_KEY"
          id=$(curl -fsS -X POST "$api" -H "$auth" -H 'Content-Type: application/json' \
            -d "{\"clearCache\":\"do_not_clear\",\"commitId\":\"$GITHUB_SHA\"}" | jq -r .id)
          echo "Render deploy $id"
          for _ in $(seq 1 90); do # ≤15 min: free-plan builds are slow, not stuck
            status=$(curl -fsS "$api/$id" -H "$auth" | jq -r .status)
            echo "$(date -u +%T) $status"
            case "$status" in
              live) exit 0 ;;
              *failed|canceled|deactivated) echo "::error::Render deploy $id ended $status"; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::Render deploy $id not live after 15 minutes"; exit 1

  # CI must never depend on live Alpaca — external tests live in tests/external
  # and run via external-smoke.yml only.
